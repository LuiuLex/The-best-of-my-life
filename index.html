<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Universo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night-950:#05050f;
    --night-900:#0a0d1f;
    --night-800:#141a33;
    --star:#f4f5ff;
    --pink:#ff8fd6;
    --lilac:#c9a6ff;
    --gold:#ffd166;
    --label-bg: rgba(10,13,31,0.55);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    width:100%;height:100%;
    background:var(--night-950);
    overflow:hidden;
    font-family:'Poppins',system-ui,-apple-system,sans-serif;
  }
  #sky{
    position:fixed;inset:0;
    width:100vw;height:100vh;
    background:
      radial-gradient(ellipse at 50% 20%, #171e3d 0%, #0a0d1f 45%, #05050f 100%);
  }
  canvas#stars{
    position:fixed;inset:0;
    width:100%;height:100%;
    display:block;
  }
  #field{
    position:fixed;inset:0;
    width:100%;height:100%;
    pointer-events:none;
  }
  .floaty{
    position:absolute;
    top:0;left:0;
    will-change:transform,opacity;
    white-space:nowrap;
    font-family:'Caveat',cursive;
    font-weight:600;
    color:var(--pink);
    text-shadow:
      0 0 6px rgba(255,143,214,0.55),
      0 0 18px rgba(255,143,214,0.35);
    transform-origin:center;
    user-select:none;
  }
  .floaty.alt{ color:var(--lilac); text-shadow:0 0 6px rgba(201,166,255,.55),0 0 18px rgba(201,166,255,.35); }
  .photo{
    position:absolute;
    top:0;left:0;
    width:64px;height:64px;
    border-radius:10px;
    padding:5px;
    background:#f6f1ea;
    box-shadow:0 6px 18px rgba(0,0,0,.45);
    will-change:transform,opacity;
    transform-origin:center;
  }
  .photo .inner{
    width:100%;height:100%;
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    background:linear-gradient(135deg,#3a2b55,#6b3d63 45%,#a24a6b 100%);
  }
  .shooting-star{
    position:absolute;
    width:2px;height:2px;
    background:var(--star);
    border-radius:50%;
    box-shadow:0 0 6px 1px rgba(255,255,255,.9);
    opacity:0;
  }
  .shooting-star::before{
    content:"";
    position:absolute;
    top:0;left:0;
    width:120px;height:1px;
    background:linear-gradient(90deg, rgba(255,255,255,.95), rgba(255,255,255,0));
    transform-origin:0 0;
    transform:rotate(215deg);
  }

  header{
    position:fixed;
    top:0;left:0;right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px;
    z-index:5;
    pointer-events:none;
  }
  .label{
    pointer-events:auto;
    background:var(--label-bg);
    backdrop-filter:blur(6px);
    color:var(--star);
    font-size:13px;
    font-weight:500;
    letter-spacing:.3px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.08);
  }
  #starBtn{
    pointer-events:auto;
    background:none;
    border:none;
    cursor:pointer;
    padding:6px;
    line-height:0;
    filter:drop-shadow(0 0 8px rgba(226,226,255,.55));
    transition:transform .25s ease;
  }
  #starBtn:active{ transform:scale(0.85); }
  #starBtn svg{ display:block; }

  #wish{
    position:fixed;
    left:50%;
    bottom:9%;
    transform:translate(-50%,12px);
    color:var(--star);
    font-family:'Caveat',cursive;
    font-size:22px;
    opacity:0;
    pointer-events:none;
    text-shadow:0 0 10px rgba(255,209,102,.5);
    transition:opacity .5s ease, transform .5s ease;
    z-index:6;
  }
  #wish.show{ opacity:1; transform:translate(-50%,0); }

  @media (prefers-reduced-motion: reduce){
    .floaty, .photo{ animation:none !important; }
  }
</style>
</head>
<body>

<div id="sky"></div>
<canvas id="stars"></canvas>
<div id="field"></div>

<header>
  <div class="label">Universo</div>
  <button id="starBtn" aria-label="Pedir un deseo">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="#f2efe0">
      <path d="M20.6 15.2a8.7 8.7 0 01-9.8-9.8 1 1 0 00-1.3-1.1 9 9 0 1012.2 12.2 1 1 0 00-1.1-1.3z"/>
    </svg>
  </button>
</header>

<div id="wish">🌙 pediste un deseo para nosotros</div>

<script>
/* ---------- starfield background (twinkle) ---------- */
const starCanvas = document.getElementById('stars');
const ctx = starCanvas.getContext('2d');
let W, H, stars = [];

function resize(){
  W = starCanvas.width = window.innerWidth;
  H = starCanvas.height = window.innerHeight;
}
function initStars(){
  const count = Math.floor((W*H)/6500);
  stars = Array.from({length:count}, () => ({
    x: Math.random()*W,
    y: Math.random()*H,
    r: Math.random()*1.3 + 0.3,
    phase: Math.random()*Math.PI*2,
    speed: 0.4 + Math.random()*0.8
  }));
}
window.addEventListener('resize', () => { resize(); initStars(); });
resize(); initStars();

let t0 = performance.now();
function drawStars(now){
  const dt = (now - t0)/1000; t0 = now;
  ctx.clearRect(0,0,W,H);
  for(const s of stars){
    s.phase += dt*s.speed;
    const tw = 0.55 + 0.45*Math.sin(s.phase);
    ctx.globalAlpha = tw;
    ctx.fillStyle = '#f4f5ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(drawStars);
}
requestAnimationFrame(drawStars);

/* ---------- shooting stars ---------- */
function spawnShootingStar(){
  const el = document.createElement('div');
  el.className = 'shooting-star';
  const startX = Math.random()*W*0.6 + W*0.2;
  const startY = Math.random()*H*0.25;
  el.style.left = startX+'px';
  el.style.top = startY+'px';
  document.getElementById('field').appendChild(el);
  const dur = 900 + Math.random()*500;
  el.animate([
    { transform:'translate(0,0)', opacity:0 },
    { transform:'translate(30px,20px)', opacity:1, offset:0.15 },
    { transform:`translate(${220+Math.random()*80}px, ${150+Math.random()*60}px)`, opacity:0 }
  ], { duration: dur, easing:'ease-in' }).onfinish = () => el.remove();
  setTimeout(spawnShootingStar, 3500 + Math.random()*4500);
}
setTimeout(spawnShootingStar, 1500);

/* ---------- floating phrases & photos (depth warp field) ---------- */
const PHRASES = [
  "Te Amo","My love","Eres preciosa","Eres precioso","Me encantas",
  "Amor de mi vida","Mi universo","Te quiero","Contigo todo es mejor",
  "Mi persona favorita"
];
const PHOTO_ICONS = ["💞","📷","💫"];

const field = document.getElementById('field');
const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

class FloatItem{
  constructor(isPhoto){
    this.isPhoto = isPhoto;
    this.el = document.createElement('div');
    if(isPhoto){
      this.el.className = 'photo';
      this.el.innerHTML = `<div class="inner">${PHOTO_ICONS[Math.floor(Math.random()*PHOTO_ICONS.length)]}</div>`;
    } else {
      this.el.className = 'floaty' + (Math.random() < 0.5 ? ' alt' : '');
      this.el.textContent = PHRASES[Math.floor(Math.random()*PHRASES.length)];
    }
    field.appendChild(this.el);
    this.reset(true);
  }
  reset(initial){
    this.z = initial ? (300 + Math.random()*900) : (1000 + Math.random()*200);
    this.x = (Math.random()-0.5) * 1600;
    this.y = (Math.random()-0.5) * 1000;
    this.speed = (this.isPhoto ? 55 : 70) + Math.random()*40;
    if(!this.isPhoto){
      this.el.textContent = PHRASES[Math.floor(Math.random()*PHRASES.length)];
      this.el.className = 'floaty' + (Math.random() < 0.5 ? ' alt' : '');
      this.el.style.fontSize = (18 + Math.random()*10) + 'px';
    }
  }
  step(dt){
    if(!prefersReduced) this.z -= this.speed*dt;
    if(this.z < 40){ this.reset(false); }
    const focal = 380;
    const scale = focal / this.z;
    const sx = (W/2) + this.x*scale;
    const sy = (H/2) + this.y*scale;
    const fadeIn = Math.min(1, (1000 - this.z)/250);
    const fadeOut = Math.min(1, (this.z-40)/120);
    const opacity = Math.max(0, Math.min(fadeIn, fadeOut)) * (this.isPhoto ? 0.95 : 0.9);
    this.el.style.opacity = opacity;
    this.el.style.transform = `translate(${sx}px, ${sy}px) scale(${scale})`;
  }
}

const items = [];
for(let i=0;i<16;i++) items.push(new FloatItem(false));
for(let i=0;i<5;i++) items.push(new FloatItem(true));

let last = performance.now();
function animate(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  for(const it of items) it.step(dt);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

/* ---------- star button: make a wish ---------- */
const starBtn = document.getElementById('starBtn');
const wish = document.getElementById('wish');
let wishTimer = null;
starBtn.addEventListener('click', () => {
  wish.classList.add('show');
  clearTimeout(wishTimer);
  wishTimer = setTimeout(() => wish.classList.remove('show'), 2200);
  for(let i=0;i<3;i++) setTimeout(spawnShootingStar, i*180);
});
</script>
</body>
</html>
